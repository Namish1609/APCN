name: APCN V0.16 fast gate

on:
  push:
    branches: [v0.16-build]
  pull_request:
    branches: [main]
    paths:
      - 'apcn_v16/**'
      - 'tests/test_v0_16.py'
      - 'benchmark_v0_16.py'
      - 'run_desktop_v0_16.py'
      - '.github/workflows/v16-fast.yml'

jobs:
  v16-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-headless.txt
      - name: Compile V0.16
        run: |
          python -m compileall -q apcn_v16
          python -m py_compile benchmark_v0_16.py run_desktop_v0_16.py
      - name: V0.16 unit tests
        run: python -m unittest tests.test_v0_16 -v
      - name: V0.16 bidirectional benchmark
        run: python benchmark_v0_16.py
