name: APCN V0.18 fast gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'apcn_v18/**'
      - 'tests/test_v0_18.py'
      - 'benchmark_v0_18.py'
      - 'run_desktop_v0_18.py'
      - 'VERSION'
      - 'README.md'
      - 'V0_18_NATURAL_CONVERSATION.md'
      - '.github/workflows/v0_18_fast.yml'
  workflow_dispatch:

jobs:
  v018:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-headless.txt
      - name: Compile V0.18
        run: |
          python -m compileall -q apcn_v18
          python -m py_compile run_desktop_v0_18.py benchmark_v0_18.py
      - name: V0.18 tests
        run: python -m unittest tests.test_v0_18 -v
      - name: V0.18 transcript regression
        run: python benchmark_v0_18.py
