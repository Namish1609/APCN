name: APCN tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-headless.txt
      - name: Compile Python sources
        run: |
          python -m compileall -q apcn_v07 apcn_v08 apcn_v09 apcn_v10 apcn_v11 apcn_v12 apcn_v13 apcn_v14 apcn_v15
          python -m py_compile *.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: V0.12 paired perception smoke benchmark
        run: python benchmark_v0_12.py --train 480 --test 150 --difficulty 0.68
      - name: V0.12 multi-seed hard perception gate
        run: python validate_v0_12.py
      - name: V0.13 persistent instance benchmark
        run: python benchmark_v0_13.py
      - name: V0.14 held-out language benchmark
        run: python benchmark_v0_14.py
      - name: V0.14 controlled self-face memory diagnostic
        run: python benchmark_face_v0_14.py
      - name: V0.15 conversational language benchmark
        run: python benchmark_v0_15.py
