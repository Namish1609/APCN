name: APCN V0.15 fast gate

on:
  push:
    branches: [v0.15-build]
  pull_request:
    branches: [main]
    paths:
      - 'apcn_v15/**'
      - 'tests/test_v0_15.py'
      - 'benchmark_v0_15.py'
      - 'run_desktop_v0_15.py'
      - '.github/workflows/v15-fast.yml'

jobs:
  v15-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-headless.txt
      - name: Compile V0.15
        run: |
          python -m compileall -q apcn_v15
          python -m py_compile benchmark_v0_15.py run_desktop_v0_15.py
      - name: V0.15 unit tests
        run: python -m unittest tests.test_v0_15 -v
      - name: V0.15 conversational benchmark
        run: python benchmark_v0_15.py
